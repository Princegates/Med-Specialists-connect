<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>You are offline | MEDs Specialists Connect</title>
  <style>
    /* Self-contained: this page is shown when there is no connection, so it cannot rely on anything else loading.
       The font comes from the app's offline copy if it is there, and falls back to the system font if not. */
    @font-face { font-family: 'Overpass'; font-weight: 100 900; font-display: swap; src: url('/assets/fonts/overpass-latin.woff2') format('woff2'); }
    @font-face { font-family: 'Atkinson Hyperlegible Next'; font-weight: 200 800; font-display: swap; src: url('/assets/fonts/atkinson-next-latin.woff2') format('woff2'); }
    :root { --bg: #ebf1ee; --ink: #0f2a44; --soft: #3d5266; --line: #c9d8d0; --pink: #c8004a; --btn: #c8004a; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1a2a; --ink: #e8f0f6; --soft: #a7b8c8; --line: #23405c; --pink: #ff5c8f; --btn: #d6004e; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; font: 1.125rem/1.6 'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); }
    main { width: min(28rem, 100%); }
    .mark { display: block; width: 28px; height: 28px; border-radius: 50%; background: var(--pink); margin-bottom: 24px; }
    h1 { font: 800 2.4rem/1 'Overpass', system-ui, sans-serif; letter-spacing: -.03em; margin: 0 0 14px; }
    p { color: var(--soft); margin: 0 0 22px; }
    a { color: var(--ink); text-underline-offset: 3px; }
    a.btn { display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 10px; padding: 0 20px; border-radius: 10px; border: 2px solid var(--btn); background: var(--btn); color: #fff; text-decoration: none; font: 700 1.02rem 'Overpass', system-ui, sans-serif; }
    a.alt { background: transparent; color: var(--ink); border-color: var(--ink); }
    a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .danger { margin: 26px 0 0; padding: 14px 16px; border-radius: 12px; background: #f6b800; color: #0f2a44; font-weight: 700; }
    .danger a { color: #0f2a44; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true"></span>
    <h1>You are offline</h1>
    <p>This page needs an internet connection. When you are back online, reload it. If you need help now, you can still reach us.</p>
    <a class="btn" href="tel:+233243560080">Call 0243 560 080</a>
    <a class="btn alt" href="https://wa.me/233243560080">Message us on WhatsApp</a>
    <p class="danger">If someone is in danger, call <a href="tel:112">112</a>.</p>
  </main>
</body>
</html>
