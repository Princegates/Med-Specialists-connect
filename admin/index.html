<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Staff console | MEDs Specialists Connect</title>
  <link rel="icon" type="image/png" href="../assets/logo-icon.png">
  <link rel="stylesheet" href="../styles.css?v=8">
  <link rel="stylesheet" href="admin.css?v=8">
  <script src="/assets/boot.js"></script>
</head>
<body class="console">
  <a class="skip" href="#view">Skip to content</a>
  <header class="c-bar">
    <button class="c-menu c-iconbtn" type="button" id="menu-btn" aria-expanded="false" aria-controls="c-nav" aria-label="Menu"></button>
    <a class="c-brand" href="#/dashboard"><img src="../assets/logo-icon.png" alt="" width="32" height="32"><span>MEDs <b>Staff console</b></span></a>
    <div class="c-search" role="search">
      <label class="sr" for="gsearch">Search cases, clients and providers</label>
      <span class="c-search-ic" id="search-ic"></span>
      <input id="gsearch" type="search" placeholder="Search name, phone or case reference" autocomplete="off" maxlength="60">
      <div class="c-results" id="gresults" aria-live="polite" hidden></div>
    </div>
    <button class="c-iconbtn" type="button" id="theme-btn" aria-label="Switch to night mode"></button>
    <div class="c-user"><span id="who-av"></span><p class="c-who" id="who"></p></div>
  </header>
  <div class="c-body">
    <nav class="c-nav" id="c-nav" aria-label="Console"></nav>
    <main id="view" class="c-view" tabindex="-1"><p class="c-note" role="status">Loading…</p></main>
  </div>
  <div class="c-toast" id="toast" role="status" aria-live="polite"></div>
  <script src="core.js?v=8"></script>
  <script src="pages-work.js?v=8"></script>
  <script src="pages-insight.js?v=8"></script>
  <script src="pages-admin.js?v=8"></script>
  <script src="start.js?v=9"></script>
</body>
</html>
