<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Staff console | MEDs Specialists Connect</title>
  <link rel="icon" type="image/png" href="../assets/logo-icon.png">
  <link rel="stylesheet" href="../styles.css?v=7">
  <link rel="stylesheet" href="admin.css?v=7">
  <script>
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body class="console">
  <a class="skip" href="#view">Skip to content</a>
  <header class="c-bar">
    <button class="c-menu btn btn-ghost btn-small" type="button" id="menu-btn" aria-expanded="false" aria-controls="c-nav">Menu</button>
    <a class="c-brand" href="#/dashboard"><img src="../assets/logo-icon.png" alt="" width="32" height="32"><span>Staff console</span></a>
    <p class="c-who" id="who"></p>
    <button class="btn btn-ghost btn-small" type="button" id="signout">Sign out</button>
  </header>
  <div class="c-body">
    <nav class="c-nav" id="c-nav" aria-label="Console"></nav>
    <main id="view" class="c-view" tabindex="-1"><p class="c-note" role="status">Loading…</p></main>
  </div>
  <div class="c-toast" id="toast" role="status" aria-live="polite"></div>
  <script src="core.js?v=7"></script>
  <script src="pages-work.js?v=7"></script>
  <script src="pages-admin.js?v=7"></script>
  <script src="start.js?v=7"></script>
</body>
</html>
